# See: https://github.com/WordPress/plugin-check-action
#
# The checkout contains the whole repository, while WordPress.org only ever
# receives what .distignore lets through. The exclusions below keep the two in
# step, so this job checks the same file set that actually ships. /src is not
# excluded: it is distributed on purpose, so the minified assets in /build have
# readable sources next to them.
name: Plugin Check
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  plugin-check:
    name: Run Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - uses: actions/setup-node@master
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: "./"
          exclude-directories: ".github,.idea,.wordpress-org,bin,node_modules,vendor"
          exclude-files: ".distignore,.editorconfig,.gitattributes,.gitignore,.nvmrc,composer.json,composer.lock,package-lock.json,package.json,phpcs.xml.dist,phpstan.neon"
